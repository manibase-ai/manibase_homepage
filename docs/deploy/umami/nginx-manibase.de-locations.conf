    # Reichweitenmessung mit Umami (docs/deploy/umami/, eingefuegt 04.10.2026).
    # Ueber die eigene Domain, damit die CSP bei 'self' bleibt. Kein add_header hier,
    # sonst entfallen die geerbten Security-Header. X-Real-IP braucht Umami fuer Land
    # und Sitzungskennung; gespeichert wird die IP dort nicht.
    location = /u.js {
        access_log off;
        proxy_pass http://127.0.0.1:3005/script.js;
        proxy_hide_header Content-Security-Policy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/send {
        access_log off;
        client_max_body_size 8k;
        # burst fuer Veranstaltungen: viele Teilnehmer hinter einer NAT-IP (vgl. nginx-event-locations.conf)
        limit_req zone=manibase_statistik burst=300 nodelay;
        limit_req_log_level info;
        proxy_pass http://127.0.0.1:3005/api/send;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
