# http-Kontext -> /etc/nginx/conf.d/manibase-statistik.conf
# Spec: docs/superpowers/specs/2026-10-04-statistik-umami-design.md
# Rate-Limits fuer Umami: Erfassung (/api/send auf manibase.de) und Login im Dashboard.
limit_req_zone $binary_remote_addr zone=manibase_statistik:10m rate=300r/m;
limit_req_zone $binary_remote_addr zone=umami_login:1m rate=10r/m;
