# manibase.de — Infotermin-Endpunkte. In den server{}-Block des vhost aufnehmen.
# Die limit_req_zone gehört in den http{}-Kontext (einmalig, ggf. schon für den
# Newsletter vorhanden — dann NICHT doppelt anlegen, Namen wiederverwenden):
#   limit_req_zone $binary_remote_addr zone=manibase_forms:10m rate=60r/m;
#
# Rate-Limit bewusst großzügig: Beim QR-Interessenten-Flow WÄHREND der
# Veranstaltung sitzen viele Teilnehmer hinter EINER öffentlichen (NAT-)IP im
# Event-WLAN und senden nahezu gleichzeitig. Ein enges Limit (z.B. 5r/m) würde
# die meisten mit 503 abweisen. 60r/m + großer Burst fängt einen vollen Raum ab;
# Missbrauch bleibt durch Honeypot, Body-Cap, Shared-Secret und n8n-Idempotenz
# begrenzt. `nodelay` lässt den Burst sofort durch statt zu serialisieren.
#
# Produktiv wird NUR exakt diese beiden Pfade als PHP ausgeführt (Rest kein PHP).
#
# Hinweis: mbstring ist empfohlen (php8.4-mbstring); der Proxy funktioniert aber
# auch ohne (UTF-8-sicherer Fallback in event.php).

location = /api/event.php {
    limit_req zone=manibase_forms burst=40 nodelay;
    client_max_body_size 8k;
    include snippets/fastcgi-php.conf;         # bzw. die im vhost genutzte PHP-FPM-Include
    fastcgi_pass unix:/run/php/php8.4-fpm.sock; # Socket wie beim Newsletter-Endpunkt
}

location = /api/event-confirm.php {
    limit_req zone=manibase_forms burst=20 nodelay;
    client_max_body_size 8k;
    include snippets/fastcgi-php.conf;
    fastcgi_pass unix:/run/php/php8.4-fpm.sock;
}
