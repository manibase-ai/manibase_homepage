name: Verify

# Statische Gates fuer die Infotermin-n8n-Vorlagen (scripts/verify-n8n.sh), ein
# Syntax-Check der PHP-Proxys und die Frontend-Regressionstests
# (scripts/test-frontend.mjs).
#
# Warum als CI und nicht "vor dem Commit dran denken": beim Go-live am 21.07.2026
# sind fuenf Fehler erst in der laufenden n8n-Instanz aufgeschlagen, obwohl es fuer
# vier davon anschliessend ein Gate gab. Ein Gate, das nur lokal auf Zuruf laeuft,
# faengt genau den Fall nicht ab, der ihn braucht: eine spaetere, gutgemeinte
# Aenderung an den Vorlagen.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: jq und PHP bereitstellen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq jq php-cli

      - name: n8n-Vorlagen (statische Gates)
        run: bash scripts/verify-n8n.sh

      - name: jsonBody-Payloads sind gueltiges JSON
        run: python3 scripts/check-n8n-jsonbody.py "docs/n8n/workflows/wf-*.json"

      # Der statische Checker oben ersetzt jeden Ausdruck durch "X" und sieht deshalb nicht,
      # ob eine echte Nutzereingabe den Body zerlegt. Dieser Test fuehrt die Code-Nodes aus.
      - name: Graph-Payloads und ICS gegen boesartige Eingaben
        run: |
          npm i --no-save luxon
          node scripts/test-n8n-payloads.mjs

      - name: PHP-Syntax der Proxys
        run: |
          for f in site/api/*.php; do php -l "$f"; done

      # Nav-Umschaltpunkt und Pflichtfragen der Qualifizierungs-Maske. Beide Fehler
      # waren im Diff unsichtbar und fielen erst im Browser auf (Review zu PR #11).
      - name: Frontend-Regressionstests (Navigation, Qualifizierungs-Maske)
        run: |
          npm i --no-save jsdom
          node scripts/test-frontend.mjs
